<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Unblock Me 🥺</title>
<style>
  :root {
    --pink: #ff6b9d;
    --pink-light: #ffc2d9;
    --purple: #a855f7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #ffe9f1 40%, #e0c3fc 100%);
  }

  .container {
    position: relative;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    transition: opacity 0.5s ease;
  }

  .emoji {
    font-size: clamp(60px, 15vw, 120px);
    animation: wobble 2.2s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-4deg) scale(1); }
    50% { transform: rotate(4deg) scale(1.05); }
  }

  h1#message {
    color: #6b2452;
    font-size: clamp(20px, 4vw, 34px);
    margin: 10px 0 40px;
    max-width: 700px;
    line-height: 1.4;
    text-shadow: 0 2px 6px rgba(255,255,255,0.6);
    transition: all 0.3s ease;
  }

  .buttons {
    display: flex;
    gap: 30px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    border: none;
    border-radius: 50px;
    padding: 16px 34px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease, background 0.3s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #yesBtn {
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: white;
  }

  #yesBtn:hover { filter: brightness(1.05); }

  #noBtn {
    background: linear-gradient(135deg, #f87171, #ef4444);
    color: white;
  }

  #noBtn.roaming {
    position: fixed;
    z-index: 50;
    top: 50%;
    left: 50%;
  }

  .hint {
    margin-top: 26px;
    color: #8a4a72;
    font-size: 14px;
    opacity: 0.8;
    min-height: 20px;
  }

  #celebration {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(135deg, #ffd6e8, #ffe9f1 40%, #e0c3fc 100%);
    z-index: 100;
  }

  #celebration.show { display: flex; }

  #celebration .big-emoji {
    font-size: clamp(70px, 18vw, 140px);
    animation: pop 0.6s ease;
  }

  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  #celebration h1 {
    color: #6b2452;
    font-size: clamp(24px, 5vw, 40px);
    max-width: 700px;
    margin: 10px 20px 0;
  }

  .heart {
    position: fixed;
    top: -40px;
    font-size: 24px;
    pointer-events: none;
    z-index: 99;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }
</style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="emoji" id="emoji">😢</div>
  <h1 id="message">Please unblock me... 🥺</h1>
  <div class="buttons" id="buttonArea">
    <button id="yesBtn">Yes 💗</button>
    <button id="noBtn">No</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div id="celebration">
  <div class="big-emoji">🥳❤️</div>
  <h1>Yay!! Thank you for unblocking me!<br>I promise it was worth it 😍</h1>
</div>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const messageEl = document.getElementById('message');
  const emojiEl = document.getElementById('emoji');
  const hintEl = document.getElementById('hint');
  const container = document.getElementById('mainContainer');
  const celebration = document.getElementById('celebration');

  const MAX_GROW_CLICKS = 10;
  let noCount = 0;
  let roaming = false;
  let roamInterval = null;
  let unblocked = false;

  const messages = [
    "Please unblock me... 🥺",
    "Really? Come on... 😢",
    "Give me one more chance? 💔",
    "I promise I'll be better 🙏",
    "Please reconsider... I miss you 😭",
    "My heart actually hurts right now 💔😢",
    "I think about you all the time 🥺",
    "Pretty pretty please? 🍰",
    "I'll bring your favorite snacks, I swear 🍫",
    "Okay this is getting desperate... 😩",
    "Alright, the 'No' button is too scared to stand still now 😂 Yes is the only option left!"
  ];

  function updateMessage() {
    const idx = Math.min(noCount, messages.length - 1);
    messageEl.textContent = messages[idx];
  }

  function growYes() {
    const step = Math.min(noCount, MAX_GROW_CLICKS);
    const scale = 1 + step * 0.22;
    yesBtn.style.transform = `scale(${scale})`;
  }

  function shakeNo() {
    noBtn.animate(
      [
        { transform: noBtn.style.transform + ' translateX(0)' },
        { transform: noBtn.style.transform + ' translateX(-6px)' },
        { transform: noBtn.style.transform + ' translateX(6px)' },
        { transform: noBtn.style.transform + ' translateX(0)' }
      ],
      { duration: 300 }
    );
  }

  function moveNoRandom() {
    const rect = noBtn.getBoundingClientRect();
    const maxX = Math.max(window.innerWidth - rect.width - 10, 10);
    const maxY = Math.max(window.innerHeight - rect.height - 10, 10);
    const randX = Math.random() * maxX;
    const randY = Math.random() * maxY;
    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';
  }

  function startRoaming() {
    if (roaming) return;
    roaming = true;
    noBtn.classList.add('roaming');
    moveNoRandom();
    hintEl.textContent = "Catch it if you can 😏";
    roamInterval = setInterval(moveNoRandom, 850);
    noBtn.addEventListener('mouseenter', moveNoRandom);
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoRandom(); }, { passive: false });
    window.addEventListener('resize', moveNoRandom);
  }

  noBtn.addEventListener('click', (e) => {
    if (roaming) {
      moveNoRandom();
      return;
    }
    noCount++;
    growYes();
    shakeNo();
    updateMessage();
    if (noCount >= MAX_GROW_CLICKS) {
      startRoaming();
    }
  });

  function celebrate() {
    if (unblocked) return;
    unblocked = true;
    if (roamInterval) clearInterval(roamInterval);
    container.style.opacity = '0';
    setTimeout(() => {
      celebration.classList.add('show');
      spawnHearts();
    }, 400);
  }

  function spawnHearts() {
    const hearts = ['❤️', '💖', '💕', '💗', '💓'];
    for (let i = 0; i < 30; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = (3 + Math.random() * 3) + 's';
      h.style.animationDelay = (Math.random() * 3) + 's';
      h.style.fontSize = (16 + Math.random() * 20) + 'px';
      celebration.appendChild(h);
    }
  }

  yesBtn.addEventListener('click', celebrate);
</script>

</body>
</html>
